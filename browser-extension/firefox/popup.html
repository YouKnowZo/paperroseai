<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperRoseAI Page Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark">PR</span><div><strong>PaperRoseAI</strong><small>by Paperbagexpress</small></div></div>
      <h1>Read this page</h1>
      <p class="intro">Send visible page text to PaperRoseAI, then review and submit it there.</p>
      <button id="review" type="button">Review this page</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">Nothing runs until you click. The extension copies visible text only; it does not access passwords, cookies, browsing history, or hidden page data.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
